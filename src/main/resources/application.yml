spring:
  datasource:
    url: jdbc:h2:mem:finance_tracker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

storage:
  raw-files:
    path: ./data/raw

export:
  local:
    enabled: true
    path: ./data/exports
  google:
    enabled: false

pipeline:
  sample-file: sample-import.csv

google:
  application-name: finance-tracker
  sheets:
    spreadsheet-id: 1G_uvNzT8wtWGJZ3TiRSSnfHg_MspkG6bPA3AP5vjNFw
  credentials:
    path: /google-service-account.json
