spring:
  profiles:
    default: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

storage:
  raw-files:
    path: ./data/raw

export:
  local:
    enabled: true
    path: ./data/exports
  google:
    enabled: false

pipeline:
  sample-file: sample-import.csv
  auto-run: false
  system-user-id:

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32chars}
    access-ttl-minutes: 30
    refresh-ttl-days: 30
  reset:
    ttl-minutes: 30
    return-token: true

email:
  enabled: ${EMAIL_ENABLED:false}
  from: ${EMAIL_FROM:no-reply@finance-tracker.local}
  reset:
    subject: ${EMAIL_RESET_SUBJECT:Reset your Finance Tracker password}
    url-template: ${EMAIL_RESET_URL_TEMPLATE:http://localhost:8080/reset-password?token={token}&email={email}}

google:
  application-name: finance-tracker
  sheets:
    spreadsheet-id: 1G_uvNzT8wtWGJZ3TiRSSnfHg_MspkG6bPA3AP5vjNFw
  credentials:
    path: /google-service-account.json
